# Unit: AI-Generated Design: Digital Magazine (AI Foundations, Unit 1).
#
# Aligned to the team curriculum doc ("AWS Breaking Barrier"): its four concepts,
# condensed Stage 0-3 descriptors (one line per stage, for the rubric eval), and its
# concept trajectories (Stage transitions -> levels L1-L13, project P1).
# Levels, probes and practice are SYNTHETIC drafts by the engineering team;
# Teaching & Learning must review every student-facing item (BRD FR7).
# {{topic}} in student-facing text is filled with the topic the student picks.
unit:
  id: digital_magazine
  name: 'AI-Generated Design: Digital Magazine'
  selectable: true
  context: a lesson where high-school students design and build a digital magazine website for a specific reader, using AI to generate and refine HTML and CSS
  summary: 'Design like a designer: understand a reader, plan the site, prompt an AI to build it, and check it works for everyone. Ends with your own digital magazine.'
class:
  id: k-period3
  name: Period 3 - AI Foundations
  bar: 2
topics:
- school life
- sports
- music
- gaming
- the environment
- food
- art and design
- space and science
required_concepts:
- c1
- c2
- c3
- c4
concepts:
- id: c1
  name: Human-centered design
  csta: HS-ALG-IM-09
  order: 1
  descriptors:
    0: Judges designs by personal taste ("I like the colors") instead of the user's needs; design choices aren't connected to any stated need.
    1: Identifies a user's stated preferences or frustrations when given directly, but the need often collapses into a feature and reasoning stays generic ("this would help users").
    2: Interprets the user's need from context and writes it as a need, not a solution; justifies design choices by the specific user's context and separates "I don't like this" from "this doesn't work for this user because...".
    3: Anticipates needs the user hasn't stated, weighs trade-offs between choices that help one user but add friction for another, and notices personal taste disguised as a user need.
- id: c2
  name: Design structuring
  csta: CT7, HCD11 (practices; no single content standard)
  order: 2
  descriptors:
    0: Treats a website as one flat idea rather than a set of connected pages and parts.
    1: Identifies basic parts (navigation bar, hero section, cards, footer) and makes a site map or wireframe, but structure and hierarchy are inconsistent.
    2: Breaks a multi-page site into logical pages and parts with a clear hierarchy, uses abstraction on purpose (boxes and labels, no styling) and can say why, and plans a user flow between pages.
    3: Anticipates navigation needs the task didn't state, designs structure to handle them, and adapts layout patterns intentionally.
- id: c3
  name: AI collaboration and iterative prompting
  csta: HS-PRO-RD-18
  order: 3
  descriptors:
    0: Sends vague prompts with no goal, constraint, or edge case and accepts AI output without checking it.
    1: States a basic goal but leaves out constraints and edge cases; notices only obvious mismatches; revises with broad requests like "fix it".
    2: Writes prompts with a goal, at least one constraint, and an edge case; compares output to intent and names specific mismatches; revises with a targeted change and explains why the AI produced the result.
    3: Anticipates likely misinterpretations before generating, iterates one change at a time, and decides whether to keep, re-prompt, or manually override, with reasons.
- id: c4
  name: Accessible and inclusive design
  csta: HS-ALG-PS-05 (+ HS-ALG-ML-07 at Stage 3)
  order: 4
  descriptors:
    0: Evaluates a design only for personal use ("I can use it fine") and assumes AI output is neutral or correct by default.
    1: Names an accessibility issue with a checklist or in general terms ("hard to read") and recognizes, when told, that AI can repeat problems from its training data.
    2: Applies POUR to name specific issues, connects each to a concrete user impact, and proposes a change that includes more users.
    3: Audits proactively, explains training-data causes of AI defaults (what is over- or under-represented), and weighs trade-offs between accessibility, brand, and responsiveness.
checks:
  reader_detail:
    label: Uses a detail the reader actually gave
    hint: Point to something Jordan actually said or does, like reading on the bus or on a phone.
    type: regex
    pattern: "\\b(bus|phone|cracked|small|tiny|slow|data|quick|short|minutes?|on the go|commute)\\b"
  frustration:
    label: Names a frustration
    hint: Say what bothers Jordan, in Jordan's terms.
    type: regex
    pattern: "\\b(frustrat\\w*|annoy\\w*|hard|struggl\\w*|can'?t|cannot|trouble|hates?|difficult|slow|tiny|small|squint\\w*|gives? up)\\b"
  need_reason:
    label: States a need with a reason
    hint: 'Write it as a need with a reason: "Jordan needs ... because ...". Describe what Jordan needs, not a feature or an app.'
    type: all_of
    patterns:
    - "\\b(needs?|has to|must be able to|wants? to be able to)\\b"
    - "\\b(because|so that|since|so)\\b"
  justify_reader:
    label: Ties a design choice to the reader
    hint: 'Connect your choice to Jordan: "... because Jordan reads on a small phone screen".'
    type: regex
    pattern: "\\b(because|since|so that)\\b.*\\b(jordan|reader|readers|they|them|their|phone|bus)\\b|\\bfor (jordan|readers?|the reader)\\b"
  pref_vs_need:
    label: Separates personal preference from the reader's need
    hint: Say which part is your own taste and which part the reader actually needs.
    type: regex
    pattern: "\\b(prefer\\w*|preference|personal|i like|my taste|taste|opinion|just looks|not a need|actually needs?)\\b"
  anticipate:
    label: Anticipates a need the reader didn't state
    hint: Name something Jordan didn't ask for but would probably need, and say why.
    type: regex
    pattern: "\\b(didn'?t (say|ask|mention)|did not (say|ask|mention)|never (said|asked|mentioned)|unstated|might also|would also|even though|anticipat\\w*|haven'?t (said|asked))\\b"
  tradeoff:
    label: Weighs a trade-off
    hint: Name something you gain and something you give up with your choice, then say why it is still the right call.
    type: regex
    pattern: "\\b(trade-?off|on the other hand|however|downside|cost|versus|vs\\.?|but it also|at the expense|gives? up)\\b"
  parts3:
    label: Lists at least three parts
    hint: List at least three separate parts, one per line.
    type: list_items
    min: 3
  components:
    label: Uses structural part names
    hint: Use the names of web page parts, like navigation bar, hero section, article cards, or footer.
    type: regex
    pattern: "\\b(nav\\w*|menu|header|hero|cards?|footer|sections?|sidebar|banner|grid|columns?)\\b"
  pages:
    label: Names the pages of the site
    hint: Name the separate pages, like Home, Articles, About, or Contact.
    type: regex
    pattern: "\\b(home ?page|home|articles?|about|contact|issues?|archive|subscribe|page)\\b"
  hierarchy:
    label: Shows how pages connect
    hint: Show how a reader moves between pages, for example Home -> Articles -> one article.
    type: regex
    pattern: "(→|->|=>|\\bunder\\b|\\binside\\b|\\blinks? to\\b|\\bleads? to\\b|\\bfrom .{1,40} to\\b|\\bsub-?pages?\\b|\\bnested\\b|\\bclick\\w*\\b)"
  abstraction:
    label: Uses abstraction on purpose
    hint: Describe boxes and labels only, and say why you are leaving out colors and pictures for now.
    type: regex
    pattern: "\\b(box(es)?|placeholder|label(s|ed)?|no colou?rs?|without (colou?rs?|images|pictures)|grey|gray|outline|just the structure|layout only|skip(ping)? (the )?(colou?rs?|styl\\w*))\\b"
  reason:
    label: Explains why
    hint: Add the reason for your choice.
    type: regex
    pattern: "\\b(because|so that|since|so|the reason|that way)\\b"
  flow:
    label: Plans a path through the site
    hint: 'Describe the steps a reader takes, in order: first ..., then ..., finally ...'
    type: regex
    pattern: "\\b(first|then|next|after(wards)?|finally|step|flow|path|journey)\\b"
  nav_anticipate:
    label: Plans navigation the task didn't ask for
    hint: Add a way to get around that nobody asked for but readers will need, like search, categories, or 'next article', and say why.
    type: regex
    pattern: "\\b(search|filter\\w*|categor\\w*|tags?|breadcrumbs?|related|next article|back (to|button)|archive|table of contents|menu)\\b"
  goal:
    label: Prompt states a goal
    hint: Start your prompt by telling the AI what you want it to make and why.
    type: regex
    pattern: "\\b(make|create|build|design|write|generate|update|add|change|improve|turn|i want|i need|goal|so that)\\b"
  constraint:
    label: Prompt sets a constraint
    hint: Add a limit the AI has to respect, such as "use only two colors" or "no more than three sections".
    type: regex
    pattern: "\\b(only|must|no more than|at most|at least|exactly|limit\\w*|without|keep|under \\d+|max(imum)?|min(imum)?|do not|don'?t)\\b"
  prompt_edge:
    label: Prompt names an edge case
    hint: Tell the AI what to do in an unusual case, for example "if there are no articles yet, show a friendly message".
    type: regex
    pattern: "\\b(if|when|in case|unless|otherwise|empty|none|no articles|too long|small screens?|missing)\\b"
  mismatch:
    label: Names where the output misses the request
    hint: Compare the AI's page to what was asked and name the exact part that doesn't match.
    type: regex
    pattern: "\\b(but|however|instead|missing|doesn'?t|does not|didn'?t|did not|wrong|asked for|should (have|be)|isn'?t|not what)\\b"
  targeted_fix:
    label: Asks for one specific change
    hint: Ask for one exact change and name the element, like "make the article titles 20px and dark gray".
    type: all_of
    patterns:
    - "\\b(change|make|set|move|add|replace|increase|decrease|use|put|stack|remove)\\b"
    - "(\\d|\\b(px|pixels?|font|colou?r|button|header|title|nav\\w*|image|card|spacing|margin|size|contrast|label|caption)\\b)"
  why_ai:
    label: Explains why the AI did that
    hint: Say what in your prompt (or missing from it) likely caused the AI's result.
    type: regex
    pattern: "\\b(because (the|my|i) |didn'?t (say|tell|specify|mention)|did not (say|tell|specify)|i never|wasn'?t (clear|specified)|the prompt (didn'?t|did not|never))\\b"
  one_change:
    label: Iterates one change at a time
    hint: Plan your fixes one at a time, testing each before the next.
    type: regex
    pattern: "\\b(one (change|thing|fix|problem) at a time|one by one|step by step|after each|test (each|it)|then test|before (moving|the next|i move)|first .{1,60} then)\\b"
  access_issue:
    label: Names a specific accessibility issue
    hint: Name the exact barrier, like low color contrast, missing alt text, no captions, or buttons you can't reach with a keyboard.
    type: regex
    pattern: "\\b(contrast|alt( text)?|captions?|keyboard|screen ?readers?|font size|small text|tiny text|labels?|colou?r ?blind\\w*|zoom|tap targets?|autoplay|flashing)\\b"
  user_impact:
    label: Connects the issue to a real user
    hint: Say who this affects and how, for example "a reader with low vision can't read the light gray text".
    type: regex
    pattern: "\\b(for (someone|people|a (user|reader|student)|users|readers|jordan|students)|who (can'?t|cannot|has|have|uses?)|low vision|blind|deaf|hard of hearing|disabilit\\w*|can'?t (see|hear|read|use|click)|on a (small )?phone)\\b"
  pour:
    label: Names a POUR principle
    hint: 'Say which POUR principle it breaks: Perceivable, Operable, Understandable, or Robust.'
    type: regex
    pattern: "\\b(perceivable|operable|understandable|robust)\\b"
  inclusive_fix:
    label: Proposes a change that includes more users
    hint: Suggest a concrete change, like adding alt text or raising the text contrast.
    type: regex
    pattern: "\\b(add|increase|raise|use|change|include|provide|label|caption|describe|make .{1,30} (bigger|larger|darker))\\b"
  who_left_out:
    label: Names who could be left out
    hint: Name a specific group of readers who might have trouble, and why.
    type: regex
    pattern: "\\b(people|students|readers|users|someone|anyone|kids|who)\\b.*\\b(can'?t|cannot|trouble|hard|struggle|blind|deaf|low vision|color ?blind|keyboard|screen reader|phone|slow|older|english)\\b"
  training_data:
    label: Explains how AI training data shapes the output
    hint: 'Explain where the AI''s default came from: what was common or missing in the examples it learned from.'
    type: regex
    pattern: "\\b(training data|trained on|learned from|learnt from|examples it (saw|learned)|most common|over-?represent\\w*|under-?represent\\w*|bias\\w*|patterns? (it|the ai) (saw|learned))\\b"
levels:
- id: l1
  code: L1
  kind: task
  title: Take apart a magazine homepage
  intro: Before you design your own magazine about {{topic}}, look at how a real magazine homepage is put together. Here is one an AI built.
  instructions:
  - List the parts you see on this page, one per line.
  - Next to each part, say what it does for a reader.
  ai_output: |-
    <nav>Home | Articles | About | Subscribe</nav>
    <header class="hero">Big photo + this week's top story</header>
    <section class="cards">
      <article>Story card</article> <article>Story card</article> <article>Story card</article>
    </section>
    <footer>Contact us · Social links · © 2026</footer>
  response_label: The parts of this page
  response_placeholder: |-
    - Navigation bar - lets readers jump to ...
    - ...
  transitions:
  - concept: c2
    from: 0
    to: 1
    checks:
    - parts3
    - components
- id: l2
  code: L2
  kind: task
  title: Meet your reader
  intro: 'Great magazines are made for someone specific. Your reader is Jordan, 15. Jordan reads on an old phone with a cracked screen, mostly on the bus to school, often on slow data. Jordan says: "The text on most sites is tiny, pages take forever to load, and I give up if I can''t find something in a few seconds. I like short pieces I can finish before my stop."'
  instructions:
  - Write down two things Jordan told you, in your own words.
  - For each one, say what it means for a magazine about {{topic}}.
  response_label: What Jordan told you
  response_placeholder: |-
    1. Jordan said ...
       This means ...
  transitions:
  - concept: c1
    from: 0
    to: 1
    checks:
    - reader_detail
    - frustration
- id: l3
  code: L3
  kind: task
  preview: true
  title: Ask the AI for your cover page
  intro: Time to talk to the AI. You want a cover page for your magazine about {{topic}}.
  instructions:
  - Write the prompt you would send the AI to make the cover page.
  - Then name one reader who might have trouble using an AI-made cover, and why.
  response_label: Your prompt, and who might have trouble
  response_placeholder: |-
    Prompt: Create a cover page for ...
    Who might have trouble: ...
  transitions:
  - concept: c3
    from: 0
    to: 1
    checks:
    - goal
  - concept: c4
    from: 0
    to: 1
    checks:
    - who_left_out
- id: l4
  code: L4
  kind: task
  title: Turn a frustration into a need
  intro: 'Your reader is Jordan, 15. Jordan reads on an old phone with a cracked screen, mostly on the bus to school, often on slow data. Jordan says: "The text on most sites is tiny, pages take forever to load, and I give up if I can''t find something in a few seconds. I like short pieces I can finish before my stop." A designer''s job is to find the need behind the complaint.'
  instructions:
  - 'Finish this sentence: "Jordan needs ... because ..."'
  - Describe what Jordan needs, not an app or a feature.
  response_label: Jordan's need
  response_placeholder: Jordan needs ... because ...
  transitions:
  - concept: c1
    from: 0
    to: 1
    checks:
    - need_reason
- id: l5
  code: L5
  kind: task
  title: Check the AI's article page for barriers
  intro: An AI made an article page for your {{topic}} magazine. It looks modern, but not every reader can use it.
  instructions:
  - Name two problems that would stop some readers from using this page.
  - For each one, say who it affects and how.
  - Say what you would change, keeping Jordan in mind.
  ai_output: |-
    <article style="color:#c8c8c8; background:#ffffff; font-size:11px">
      <img src="cover.jpg">
      <video autoplay src="intro.mp4"></video>
      <h1>Top 10 stories this week</h1>
      <p>Long paragraph in thin, light gray 11px text...</p>
      <div onclick="next()">Next</div>
    </article>
  response_label: Barriers you found
  response_placeholder: |-
    1. Problem: ...
       Who it affects: ...
       Change: ...
  transitions:
  - concept: c4
    from: 0
    to: 1
    checks:
    - access_issue
  - concept: c4
    from: 1
    to: 2
    checks:
    - access_issue
    - user_impact
  - concept: c1
    from: 1
    to: 2
    checks:
    - justify_reader
- id: l6
  code: L6
  kind: task
  preview: true
  title: Give the AI a goal, a limit, and a what-if
  intro: Vague prompts get vague results. Your magazine needs an article list page.
  instructions:
  - Write a prompt for the article list that says what you want and why.
  - Add at least one limit the AI must follow.
  - Tell the AI what to do in one unusual case.
  response_label: Your prompt
  response_placeholder: Create an article list page for my {{topic}} magazine that ...
  transitions:
  - concept: c3
    from: 0
    to: 1
    checks:
    - goal
  - concept: c3
    from: 1
    to: 2
    checks:
    - goal
    - constraint
    - prompt_edge
- id: l7
  code: L7
  kind: task
  title: Pick a look that fits your reader
  intro: 'Your magazine needs a brand: colors, fonts, and a style. Your reader is Jordan, 15. Jordan reads on an old phone with a cracked screen, mostly on the bus to school, often on slow data. Jordan says: "The text on most sites is tiny, pages take forever to load, and I give up if I can''t find something in a few seconds. I like short pieces I can finish before my stop."'
  instructions:
  - Choose your colors and font style.
  - For each choice, explain why it works for Jordan, not just why you like it.
  - Name one choice that is your own taste, not something Jordan needs.
  response_label: Your brand choices and reasons
  response_placeholder: |-
    Colors: ... because Jordan ...
    Font: ... because ...
    My own taste: ...
  transitions:
  - concept: c1
    from: 1
    to: 2
    checks:
    - justify_reader
    - pref_vs_need
- id: l8
  code: L8
  kind: task
  title: Map your magazine
  intro: Plan the pages before building anything. A site map shows the pages and how readers move between them.
  instructions:
  - List the pages your {{topic}} magazine needs.
  - Show how they connect, for example Home -> Articles -> one article.
  - Explain one placement choice by thinking about Jordan.
  response_label: Your site map
  response_placeholder: |-
    Home
     -> Articles
        -> one article
     -> About
    Because Jordan ...
  transitions:
  - concept: c2
    from: 0
    to: 1
    checks:
    - parts3
  - concept: c2
    from: 1
    to: 2
    checks:
    - pages
    - hierarchy
  - concept: c1
    from: 1
    to: 2
    checks:
    - justify_reader
- id: l9
  code: L9
  kind: task
  preview: true
  title: Check the AI's page against your plan
  intro: 'You asked the AI for: "An article page with readable text on phones, a working search, and a short summary at the top of every article." Here is what it made.'
  instructions:
  - Compare the result to the request. What matches and what does not?
  - Name the POUR principle each problem breaks and who it affects.
  - Write the exact follow-up prompt you would send.
  ai_output: |-
    <input placeholder="Search"> <!-- search does nothing yet -->
    <article style="font-size:12px">
      <h1>The Big Story</h1>
      <!-- no summary -->
      <img src="team.jpg"> <!-- every generated photo shows the same kind of person -->
      <p>...</p>
    </article>
  response_label: Your check and your follow-up prompt
  response_placeholder: |-
    Matches: ...
    Doesn't match: ... (breaks Perceivable because ...)
    Follow-up prompt: ...
  transitions:
  - concept: c3
    from: 1
    to: 2
    checks:
    - mismatch
    - targeted_fix
  - concept: c4
    from: 1
    to: 2
    checks:
    - pour
    - user_impact
  - concept: c4
    from: 2
    to: 3
    checks:
    - training_data
    - inclusive_fix
- id: l10
  code: L10
  kind: task
  title: Wireframe the article page
  intro: A wireframe is a plan made of boxes and labels. It shows where things go before any colors or pictures.
  instructions:
  - 'Describe a wireframe for one article page: list each box, top to bottom, and its label.'
  - Explain why you are leaving out colors and pictures at this step.
  response_label: Your wireframe
  response_placeholder: |-
    [Box] Navigation bar
    [Box] Article title
    [Box] ...
    No colors yet because ...
  transitions:
  - concept: c2
    from: 1
    to: 2
    checks:
    - abstraction
    - reason
- id: l11
  code: L11
  kind: task
  preview: true
  title: Make it work on a phone
  intro: On Jordan's phone, the AI-made article cards overlap and the menu covers the title.
  instructions:
  - Write one follow-up prompt that fixes the layout on small screens. Name the exact change.
  - Say what in the first prompt probably caused the problem.
  - Describe the path Jordan takes from the homepage to an article on a phone.
  ai_output: |-
    <!-- On a 375px screen -->
    <div class="cards" style="display:flex; width:1200px">  <!-- cards overflow and overlap -->
    <nav style="position:fixed; top:0">  <!-- menu covers the article title -->
  response_label: Your fix, why it happened, and the path
  response_placeholder: |-
    Follow-up prompt: On screens narrower than ...
    Why it happened: my first prompt didn't ...
    Path: first ..., then ...
  transitions:
  - concept: c3
    from: 1
    to: 2
    checks:
    - targeted_fix
    - why_ai
  - concept: c2
    from: 1
    to: 2
    checks:
    - hierarchy
    - flow
- id: l12
  code: L12
  kind: task
  title: Fix it one change at a time
  intro: 'The AI''s magazine has three problems: tiny gray text, icons with no labels, and generated photos that all show the same kind of person.'
  instructions:
  - Plan how you would fix these with the AI, one change at a time, testing each before the next.
  - Explain why the AI might have made the photos this way.
  - Name one trade-off between accessibility and the look of your brand.
  response_label: Your plan
  response_placeholder: |-
    First I will ... then test ...
    The photos happened because ...
    Trade-off: ...
  transitions:
  - concept: c3
    from: 2
    to: 3
    checks:
    - one_change
    - reason
  - concept: c4
    from: 2
    to: 3
    checks:
    - training_data
    - tradeoff
- id: l13
  code: L13
  kind: task
  title: Reader-test your plan
  intro: 'Before building, step into Jordan''s shoes and test your plan. Your reader is Jordan, 15. Jordan reads on an old phone with a cracked screen, mostly on the bus to school, often on slow data. Jordan says: "The text on most sites is tiny, pages take forever to load, and I give up if I can''t find something in a few seconds. I like short pieces I can finish before my stop."'
  instructions:
  - Name one thing Jordan would need that nobody asked for, and how your design handles it.
  - Add one way to get around the site that the task didn't mention, and say why.
  - Name one trade-off your design makes between two kinds of readers.
  response_label: What reader-testing changed
  response_placeholder: |-
    Unstated need: ...
    New navigation: ... because ...
    Trade-off: ...
  transitions:
  - concept: c1
    from: 2
    to: 3
    checks:
    - anticipate
    - tradeoff
  - concept: c2
    from: 2
    to: 3
    checks:
    - nav_anticipate
    - reason
- id: p1
  code: P1
  kind: project
  title: Build your digital magazine
  intro: 'Put it all together: plan and build a small digital magazine about {{topic}} for a reader you define, working with an AI.'
  instructions:
  - Describe your reader and what they need.
  - Share your site map and the prompts you sent, and how you checked and revised the AI's output.
  - Note the changes you made so more readers can use it.
  response_label: Your project log
  response_placeholder: |-
    Reader: ...
    Site map: ...
    Prompt 1: ...
    What I checked and changed: ...
    Accessibility changes: ...
  transitions: []
project_level_id: p1
fallback_sequence:
- l1
- l2
- l3
- l4
- l5
- l6
- l7
- l8
- l9
- l10
- p1
practice:
- id: pm-c1-01
  concept: c1
  from: 0
  to: 1
  title: What does Sam need?
  scenario: 'Sam uses the school lunch menu site and says: "I can never tell which meals are vegetarian, and the page is huge on my phone."'
  task: Write down the two things Sam told you, in your own words.
  tip: Stick to what Sam actually said.
- id: pm-c1-12
  concept: c1
  from: 1
  to: 2
  title: Need, not feature
  scenario: Priya plays in the school band and misses rehearsals because the schedule changes and she doesn't notice.
  task: Write Priya's need as "Priya needs ... because ..." without naming an app or a feature.
  tip: A need describes what Priya has to be able to do, not the tool.
- id: pm-c1-23
  concept: c1
  from: 2
  to: 3
  title: What nobody asked for
  scenario: Students asked for a faster way to sign up for clubs on the school site. Some students share one family phone.
  task: Name one need nobody asked for that your sign-up design should handle, and the trade-off it creates.
  tip: Think about who uses the page but wasn't in the room when it was requested.
- id: pm-c2-01
  concept: c2
  from: 0
  to: 1
  title: Parts of a news page
  scenario: 'Picture your school''s news page: a menu at the top, a big photo, a list of stories, and contact info at the bottom.'
  task: List the parts of the page, one per line, using web page part names.
  tip: Navigation bar, hero section, cards, and footer are all part names.
- id: pm-c2-12
  concept: c2
  from: 1
  to: 2
  title: Map a club site
  scenario: The art club wants a site with a gallery, an events calendar, a join form, and an about page.
  task: Write a site map showing the pages and how a visitor moves between them.
  tip: Use arrows, like Home -> Gallery -> one artwork.
- id: pm-c2-23
  concept: c2
  from: 2
  to: 3
  title: Navigation nobody asked for
  scenario: A recipe site has 200 recipes on one long page. The request only asked for "a list of recipes".
  task: Add one way to get around the site that the request didn't mention, and explain why visitors need it.
  tip: Think about how someone finds one recipe out of 200.
- id: pm-c3-01
  concept: c3
  from: 0
  to: 1
  title: Say what you want
  scenario: The environment club wants an AI to make a poster page about recycling at school.
  task: Write the prompt you would send, stating the goal of the page.
  tip: Say what the page should make people do.
- id: pm-c3-12
  concept: c3
  from: 1
  to: 2
  title: Goal, limit, what-if
  scenario: A tutoring group's first prompt was "make a tutoring schedule".
  task: Rewrite it with a goal, one limit, and what the AI should do if a time slot is empty.
  tip: A limit controls how the AI does it, like layout, size, or colors.
- id: pm-c3-23
  concept: c3
  from: 2
  to: 3
  title: Plan your revisions
  scenario: An AI-made event page has a broken sign-up button, tiny text, and the wrong date format.
  task: Plan how you would fix these with the AI one change at a time, and how you would test each fix.
  tip: Decide which fix to do first and how you'll know it worked.
- id: pm-c4-01
  concept: c4
  from: 0
  to: 1
  title: Who could miss it?
  scenario: The school posts announcements only as images with small text inside them.
  task: Name one group of students who could miss these announcements, and why.
  tip: Think about how different people read or reach a website.
- id: pm-c4-12
  concept: c4
  from: 1
  to: 2
  title: Name the principle
  scenario: A sports team video page has no captions and buttons that only work with a mouse.
  task: Name the POUR principle each problem breaks, who it affects, and one fix.
  tip: Perceivable, Operable, Understandable, Robust.
- id: pm-c4-23
  concept: c4
  from: 2
  to: 3
  title: Where the default came from
  scenario: An AI makes stock photos for a coding club site, and every coder pictured looks the same.
  task: Explain why the AI might do this and what you would change in the design to include more students.
  tip: Think about what the AI saw most often in its examples.
diagnostic:
  intro: Before you start, answer a few quick questions about designing websites with AI. This just helps us pick where you start. It is not a test, and nothing here is graded.
  bank:
  - id: c1-1a
    concept: c1
    stage: 1
    source: C1 S1 Q1
    prompt: Emma is using a school website. She says, "The words are too small, and I have trouble reading them." What problem is Emma having?
    options:
    - id: a
      text: The website has too many pictures
    - id: b
      text: The text on the website is too small
    - id: c
      text: The website has too many colors
    - id: d
      text: The website loads too slowly
    answer: b
  - id: c1-1b
    concept: c1
    stage: 1
    source: C1 S1 Q2
    prompt: Alex says, "I prefer websites with simple layouts and large buttons." Which design best matches what Alex said?
    options:
    - id: a
      text: A website with many small buttons and pictures
    - id: b
      text: A website with complicated menus
    - id: c
      text: A website with large buttons and a simple layout
    - id: d
      text: A website with many animations
    answer: c
  - id: c1-1c
    concept: c1
    stage: 1
    source: C1 S1 Q3
    prompt: A student testing a school app says, "I can't find the homework page because there are too many buttons." What is the most obvious usability problem?
    options:
    - id: a
      text: The app does not have enough colors
    - id: b
      text: The app needs more pictures
    - id: c
      text: The app should have more features
    - id: d
      text: The app is hard to navigate
    answer: d
  - id: c1-2a
    concept: c1
    stage: 2
    source: C1 S2 Q1
    prompt: Maya checks her homework assignments on her phone while riding the bus, but her internet connection is often poor during the ride. Which statement best describes Maya's underlying need?
    options:
    - id: a
      text: Maya needs an app with colorful backgrounds
    - id: b
      text: Maya needs to see her homework assignments even when her connection is poor
    - id: c
      text: Maya needs a new phone with better features
    - id: d
      text: Maya needs an app that plays music while she studies
    answer: b
  - id: c1-2b
    concept: c1
    stage: 2
    source: C1 S2 Q2
    prompt: Lucas has trouble reading text when the word color and background color are too similar. You are designing a learning website for him. Which decision is best, and why?
    options:
    - id: a
      text: Light gray text on a white background, because it looks modern
    - id: b
      text: More animations, because they make the site interesting
    - id: c
      text: Dark text on a light background, because strong contrast makes the words easier for Lucas to read
    - id: d
      text: Smaller text, so more fits on each page
    answer: c
  - id: c1-2c
    concept: c1
    stage: 2
    source: C1 S2 Q3
    prompt: You designed a homework app for students who need to check upcoming assignments quickly, but they must click through four pages to see their deadlines. Which evaluation best explains the problem?
    options:
    - id: a
      text: The app does not meet students' need to find assignments quickly, because the deadlines are hard to reach
    - id: b
      text: The app is badly designed because four pages are always too many for any app
    - id: c
      text: The app needs brighter colors to be more attractive
    - id: d
      text: The app works because it includes all the homework information
    answer: a
  - id: c1-3a
    concept: c1
    stage: 3
    source: C1 S3 Q1
    prompt: You are designing a school lunch ordering app. Students want to order quickly. In your research you learn some students have food allergies, but nobody asked for allergy information. What should you do?
    options:
    - id: a
      text: Only make ordering faster, because that is what students asked for
    - id: b
      text: Remove some food choices to make the app simpler
    - id: c
      text: Add more colorful food pictures
    - id: d
      text: Include clearly labeled, school-verified allergy information, because students may need it to choose safely even though they did not ask
    answer: d
  - id: c1-3b
    concept: c1
    stage: 3
    source: C1 S3 Q2
    prompt: You are designing a class discussion app. Some students prefer voice messages because typing is slow. Others have hearing difficulties or cannot record in a noisy classroom. Which decision best balances these needs?
    options:
    - id: a
      text: Allow only voice messages because they are faster
    - id: b
      text: Allow both voice messages and text, so each student can choose a method that works for them
    - id: c
      text: Allow only text because it is easier to organize
    - id: d
      text: Design it around whichever method you personally prefer
    answer: b
  - id: c1-3c
    concept: c1
    stage: 3
    source: C1 S3 Q3
    prompt: You made a study planner for students who lose track of deadlines. In testing, 8 of 10 students could not find their next assignment, though several loved the purple background. One says, "I need the app to be purple because purple makes it easier to use." What is the best next step?
    options:
    - id: a
      text: Keep the design because students like how it looks
    - id: b
      text: Make it a brighter purple because a student called it a need
    - id: c
      text: Improve how upcoming assignments are shown, since testing shows students cannot find deadlines, and treat the purple as a personal preference
    - id: d
      text: Add more decorations to make it even more attractive
    answer: c
  - id: c2-1a
    concept: c2
    stage: 1
    source: C2 S1 Q1
    prompt: Look at this site map. Where would a page about beginner yoga classes most logically belong?
    figure: |-
      Home
       ├─ Activities
       ├─ About
       └─ Contact
    options:
    - id: a
      text: Under Contact
    - id: b
      text: Outside the website structure
    - id: c
      text: Under Activities
    - id: d
      text: Under About
    answer: c
  - id: c2-1b
    concept: c2
    stage: 1
    source: C2 S1 Q2
    prompt: You are planning a class schedule page. What should go in the box labeled "main content"?
    options:
    - id: a
      text: The website's file storage location
    - id: b
      text: Information about the available classes and their schedules
    - id: c
      text: Only the final background colors
    - id: d
      text: The web hosting provider's name
    answer: b
  - id: c2-1c
    concept: c2
    stage: 1
    source: C2 S1 Q3
    note: Options and answer drafted by the team (the source question had none). Needs T&L review.
    prompt: A student makes a site map with the pages Home, Classes, Registration, and Contact, but the pages are not connected. What basic improvement would make the site map more useful?
    options:
    - id: a
      text: Connect the pages to show how a visitor moves between them, starting from Home
    - id: b
      text: Give each page box a different color
    - id: c
      text: Remove the Contact page so there are fewer pages
    - id: d
      text: Write the page names in a bigger font
    answer: a
  - id: c2-2a
    concept: c2
    stage: 2
    source: C2 S2 Q1
    prompt: You are planning a website for a community center. Visitors need to discover activities, schedules, and class details like instructors, and register for classes. Which site structure shows the best decomposition and organization?
    options:
    - id: a
      text: Homepage → Activities → Individual Class Pages → Registration, plus instructor and contact pages, with consistent navigation
    - id: b
      text: One homepage with all the information, forms, schedules, and instructor profiles and no separate sections
    - id: c
      text: Several disconnected pages with different information and no clear navigation
    - id: d
      text: A separate website for each activity, each with its own unrelated navigation
    answer: a
  - id: c2-2b
    concept: c2
    stage: 2
    source: C2 S2 Q2
    prompt: You are making a wireframe for a class registration page before building it. Which approach best uses abstraction?
    options:
    - id: a
      text: Pick the final colors, fonts, photos, and animations before deciding where content goes
    - id: b
      text: Use simple boxes and labels for navigation, class information, registration fields, and buttons, and leave out visual details
    - id: c
      text: Draw a detailed picture of the finished website without marking its structural parts
    - id: d
      text: Copy another website's look exactly because its design was already tested
    answer: b
  - id: c2-2c
    concept: c2
    stage: 2
    source: C2 S2 Q3
    prompt: A visitor wants to find a beginner yoga class, see its schedule, and register. Which approach shows the best structural planning?
    options:
    - id: a
      text: Make visitors return to the homepage after each step
    - id: b
      text: Put the registration information on an unrelated page so the class page has fewer buttons
    - id: c
      text: Create a clear flow from Homepage → Activities → Yoga Classes → Registration, with consistent navigation and layouts across pages
    - id: d
      text: Use a different navigation menu and layout on each page to keep the site visually interesting
    answer: c
  - id: c2-3a
    concept: c2
    stage: 3
    source: C2 S3 Q1
    prompt: Your community center site must have pages for activities, schedules, registration, and contact. While planning, you realize visitors may want to compare several activities before registering. What is the best design decision?
    options:
    - id: a
      text: Follow the original requirements exactly, because adding anything would complicate the site
    - id: b
      text: Add a separate page for every possible action, even if navigation gets more complicated
    - id: c
      text: Adjust the site map so visitors can compare activities and move directly between activity details, schedules, and registration
    - id: d
      text: Use the same wireframe for every page no matter what it contains
    answer: c
  - id: c2-3b
    concept: c2
    stage: 3
    source: C2 S3 Q2
    prompt: A team is planning a 12-page website. They need to check whether the overall navigation makes sense and whether users can easily complete a registration form. Which approach shows the strongest use of site maps and wireframes?
    options:
    - id: a
      text: Use a site map to check how the pages connect, and a detailed wireframe to check how the registration form is organized
    - id: b
      text: Make detailed wireframes for all 12 pages before thinking about how they connect
    - id: c
      text: Use only a site map, because it shows every detail of the layout
    - id: d
      text: Focus on visual branding first and figure out navigation after building
    answer: a
  - id: c2-3c
    concept: c2
    stage: 3
    source: C2 S3 Q3
    prompt: Your site lets users browse dozens of classes and register. Your first design is one long page listing every class, and testers say it is hard to find relevant activities. Which revision is best?
    options:
    - id: a
      text: Keep the structure and change the background colors to make it more attractive
    - id: b
      text: Add more descriptions to the same page so users have more information
    - id: c
      text: Create a completely different navigation system for each class category
    - id: d
      text: Organize classes into consistent categories, add filtering, and reuse one class-detail layout so browsing and registering are clearer
    answer: d
  - id: c3-1a
    concept: c3
    stage: 1
    source: C3 S1 Q2
    prompt: A student asks an AI for a blue website with three navigation buttons. The AI makes a red website with three navigation buttons. Which evaluation correctly identifies the obvious mismatch?
    options:
    - id: a
      text: The navigation buttons match the request, but the website uses the wrong color
    - id: b
      text: The website completely matches the request
    - id: c
      text: The website should be rejected because it has navigation buttons
    - id: d
      text: The AI did not make any of the requested features
    answer: a
  - id: c3-1b
    concept: c3
    stage: 1
    source: C3 S1 Q1
    prompt: You want an AI to make a page showing the activities a community center offers. Which prompt states the basic goal, even if it could include more detail?
    options:
    - id: a
      text: Make it look interesting
    - id: b
      text: Create a webpage that lists the activities offered by a community center
    - id: c
      text: Generate something for visitors
    - id: d
      text: Make a modern design
    answer: b
  - id: c3-1c
    concept: c3
    stage: 1
    source: C3 S1 Q3
    prompt: An AI-made website has text that is hard to read. You notice and want to make a first revision. Which response is an attempt to improve the output, even if it is not very specific yet?
    options:
    - id: a
      text: The AI must be right, so I will keep the design
    - id: b
      text: I will ignore it because the website looks good
    - id: c
      text: '"Make the text easier to read."'
    - id: d
      text: Delete the whole website without trying to improve it
    answer: c
  - id: c3-2a
    concept: c3
    stage: 2
    source: C3 S2 Q2
    prompt: You ask an AI for a website with readable text on phones, a working class search, and a visible registration button. The result has attractive colors and a visible registration button, but the text is tiny on phones and the search does not work. Which evaluation shows the best reasoning?
    options:
    - id: a
      text: The registration button meets one requirement, but the tiny text and broken search fail two others, so those need fixing before you accept it
    - id: b
      text: It meets the request because it looks professional and has a registration button
    - id: c
      text: Regenerate the whole website because the colors are not appealing
    - id: d
      text: Accept it, because AI tools are generally reliable
    answer: a
  - id: c3-2b
    concept: c3
    stage: 2
    source: C3 S2 Q1
    prompt: You want an AI to make a mobile-friendly class registration page. Users must be able to pick classes and register, including when a class is full. Which prompt should you send?
    options:
    - id: a
      text: '"Make a nice-looking website for a community center."'
    - id: b
      text: '"Create a registration page with attractive colors and a modern layout."'
    - id: c
      text: '"Create a mobile-responsive class registration page where users select classes and submit a registration form. Use readable text and accessible form controls. If a class is full, show a clear message and an option to join a waitlist."'
    - id: d
      text: '"Generate a website where people can register for classes. Make it look professional."'
    answer: c
  - id: c3-2c
    concept: c3
    stage: 2
    source: C3 S2 Q3
    prompt: On small screens, an AI-made class schedule page shows class titles overlapping the registration buttons. Which follow-up prompt shows the best iteration?
    options:
    - id: a
      text: '"Fix the website and make it look better."'
    - id: b
      text: '"Redesign the whole website with a completely different layout."'
    - id: c
      text: '"Change the background colors so the registration buttons stand out."'
    - id: d
      text: '"On screens 375 pixels wide or narrower, put each class title above its registration button and add enough spacing to prevent overlap. Keep the rest of the design the same."'
    answer: d
  - id: c3-3a
    concept: c3
    stage: 3
    source: C3 S3 Q3
    prompt: An AI makes a registration form that looks right and passes basic testing. But every attempt to have the AI fix its keyboard navigation breaks other features that worked. What is the best decision?
    options:
    - id: a
      text: Keep asking for the same change until the AI eventually gets it right
    - id: b
      text: Accept the form because it looks right and works with a mouse
    - id: c
      text: Keep the working parts, fix the keyboard accessibility yourself if you can, and test the final form against every requirement
    - id: d
      text: Drop keyboard navigation from the requirements because the AI is struggling with it
    answer: c
  - id: c3-3b
    concept: c3
    stage: 3
    source: C3 S3 Q1
    prompt: You are using an AI website builder to turn a wireframe into a responsive site. The wireframe shows three activity cards in a row but does not say how they should look on small screens. Which prompt is best?
    options:
    - id: a
      text: '"Create a website that looks exactly like this wireframe."'
    - id: b
      text: '"Create a responsive website from this wireframe. Keep the three activity cards in one row on desktop, but stack them vertically on narrow mobile screens. Keep their order, keep text readable, and prevent horizontal scrolling."'
    - id: c
      text: '"Build a modern-looking website with three activity cards and attractive colors."'
    - id: d
      text: '"Generate the website first, and I will tell you what to fix afterward."'
    answer: b
  - id: c3-3c
    concept: c3
    stage: 3
    source: C3 S3 Q2
    prompt: 'An AI-made website has three problems: the menu overlaps the logo, the class cards are too narrow, and the registration buttons do not work. Which approach shows the best iterative prompting?'
    options:
    - id: a
      text: Ask the AI to fix all three at once without checking which changes worked
    - id: b
      text: Regenerate the whole website again and again until the problems disappear
    - id: c
      text: Rewrite the original prompt with more descriptive words, but do not test the changes
    - id: d
      text: Fix one problem at a time, test each revision against its requirement, and keep successful changes before moving on
    answer: d
  - id: c4-1a
    concept: c4
    stage: 1
    source: C4 S1 Q1
    prompt: A school website shows light gray words on a white background, and they are hard to read. What is the accessibility problem?
    options:
    - id: a
      text: The website has too many pictures
    - id: b
      text: The text does not have enough color contrast
    - id: c
      text: The website has too many pages
    - id: d
      text: The website needs more animations
    answer: b
  - id: c4-1b
    concept: c4
    stage: 1
    source: C4 S1 Q2
    prompt: A student cannot use a mouse because of a physical disability and needs to use a school website with only a keyboard. Which feature would help?
    options:
    - id: a
      text: More colorful backgrounds
    - id: b
      text: Music that plays automatically
    - id: c
      text: Being able to reach every button and menu with the keyboard
    - id: d
      text: More pictures on every page
    answer: c
  - id: c4-1c
    concept: c4
    stage: 1
    source: C4 S1 Q3
    prompt: Your teacher explains that AI sometimes repeats accessibility problems from the examples it learned from. What does this mean?
    options:
    - id: a
      text: AI-generated designs are always accessible to everyone
    - id: b
      text: AI automatically understands every user's needs
    - id: c
      text: AI cannot create websites for students
    - id: d
      text: AI may copy design problems from the examples it learned from
    answer: d
  - id: c4-2a
    concept: c4
    stage: 2
    source: C4 S2 Q1
    prompt: A school website has a video explaining how to do homework, but the video has no captions. Which accessibility principle is most affected, and why?
    options:
    - id: a
      text: Perceivable, because students who cannot hear the audio may miss important information
    - id: b
      text: Operable, because the website has too many buttons
    - id: c
      text: Understandable, because the website uses too many colors
    - id: d
      text: Robust, because the video is too long
    answer: a
  - id: c4-2b
    concept: c4
    stage: 2
    source: C4 S2 Q2
    prompt: An AI makes a study app with small text, thin fonts, and light-colored buttons. It looks modern, but students with low vision struggle to use it. Which change makes it more inclusive?
    options:
    - id: a
      text: Add more animations to make it interesting
    - id: b
      text: Keep it, because most students think it looks good
    - id: c
      text: Increase the text size and color contrast so students with low vision can read and use it
    - id: d
      text: Remove all the buttons so it looks simpler
    answer: c
  - id: c4-2c
    concept: c4
    stage: 2
    source: C4 S2 Q3
    prompt: An AI makes pictures of students for a technology club website. Almost every picture shows the same type of student, even though the school's students come from many backgrounds. Why might the AI do this?
    options:
    - id: a
      text: AI always chooses the most accurate picture of students
    - id: b
      text: The AI may have learned from training data that overrepresents some groups and underrepresents others
    - id: c
      text: AI intentionally leaves out students from different backgrounds
    - id: d
      text: Students from different backgrounds cannot join technology clubs
    answer: b
  - id: c4-3a
    concept: c4
    stage: 3
    source: C4 S3 Q1
    prompt: Your school will use an AI tool to make a new learning website. Before students try it, you are asked to find possible accessibility problems. What is the most effective approach?
    options:
    - id: a
      text: Check whether it looks attractive and uses the school colors
    - id: b
      text: Wait for students to complain before improving accessibility
    - id: c
      text: Ask the AI whether the website is accessible and accept its answer
    - id: d
      text: Test keyboard navigation, text contrast, image descriptions, and screen-reader support to find barriers for different users
    answer: d
  - id: c4-3b
    concept: c4
    stage: 3
    source: C4 S3 Q2
    prompt: An AI makes pictures for a career website. Most pictures of engineers show men, and most pictures of nurses show women. Which explanation and solution best address the underlying problem?
    options:
    - id: a
      text: The AI may have learned gender stereotypes from unbalanced training data. Review its data sources and improve representation, and change the pictures to show people of different genders in both careers
    - id: b
      text: The AI is right because its pictures show what all engineers and nurses look like
    - id: c
      text: Changing the website's background color fixes the problem
    - id: d
      text: Keep the same pictures because students are used to them
    answer: a
  - id: c4-3c
    concept: c4
    stage: 3
    source: C4 S3 Q3
    prompt: An AI design tool suggests using only small icons without text labels to match the school's modern brand. Some students cannot tell what the icons mean, and screen-reader users cannot tell what they do. What is the best decision?
    options:
    - id: a
      text: Keep the icons because the brand matters most
    - id: b
      text: Replace all icons with long paragraphs, even if navigation gets harder
    - id: c
      text: Keep a consistent visual style while adding clear text labels and accessible names to the icons
    - id: d
      text: Make a separate website only for students with disabilities and leave the original as is
    answer: c
