# Unit: Intro to Python.
#
# Same objectives for everyone, different support: Stage 0->1 steps are drag-and-drop
# (Parsons problems: put the lines in order), 1->2 steps are fill-in-the-blank, and 2->3
# steps are written from scratch. Parsons and fill steps are graded deterministically
# (no model call). SYNTHETIC drafts by the engineering team; T&L must review (FR7).
unit:
  id: intro_python
  name: Intro to Python
  selectable: true
  context: an introductory Python programming lesson for high-school students covering variables, conditionals, loops, and functions
  summary: 'Variables, if statements, loops, and functions. Steps adapt to you: put lines in order, fill in the blanks, or write it yourself. Ends with your own quiz game.'
class:
  id: k-period3
  name: Period 3 - Intro to Python
  bar: 2
topics:
- school life
- sports
- music
- gaming
- robotics
- art
- esports
- science
required_concepts:
- c1
- c2
- c3
- c4
concepts:
- id: c1
  name: Variables and data
  csta: 3A-AP-14
  order: 1
  descriptors:
    0: Cannot yet say what a variable holds or why order of lines matters.
    1: Stores and prints values in variables in a working order.
    2: Uses input, converts between text and numbers, and combines values correctly.
    3: Writes complete programs that read, convert, and calculate with user input on their own.
- id: c2
  name: Conditionals
  csta: 3A-AP-15
  order: 2
  descriptors:
    0: Cannot yet predict which branch of an if statement runs.
    1: Orders a working if / else and predicts its output.
    2: Completes if / elif / else chains with correct comparisons, including boundary values.
    3: Writes multi-branch decisions from a description and tests the boundary cases.
- id: c3
  name: Loops
  csta: 3A-AP-15
  order: 3
  descriptors:
    0: Cannot yet tell which lines repeat in a loop.
    1: Orders a working for or while loop and predicts how many times it runs.
    2: Completes loops that go through a list and build up a result.
    3: Writes loops with counters or conditions from a description, without infinite loops.
- id: c4
  name: Functions
  csta: 3A-AP-18
  order: 4
  descriptors:
    0: Cannot yet tell a function definition from a function call.
    1: Orders a working function definition and call.
    2: Completes functions with parameters and return values and calls them correctly.
    3: Designs and writes their own functions, returns results, and reuses them.
checks:
  uses_input:
    label: Asks the user for input
    hint: Use input(...) to ask the user something.
    type: regex
    pattern: "\\binput\\s*\\("
  converts:
    label: Converts text to a number
    hint: input() gives text; use int(...) or float(...) to do math with it.
    type: regex
    pattern: "\\b(int|float)\\s*\\("
  prints:
    label: Prints a result
    hint: Use print(...) to show the result.
    type: regex
    pattern: "\\bprint\\s*\\("
  if_elif_else:
    label: Uses if, elif, and else
    hint: Handle all three cases with if, elif, and else.
    type: all_of
    patterns:
    - "\\bif\\b"
    - "\\belif\\b"
    - "\\belse\\b"
  comparison:
    label: Compares values
    hint: Use a comparison like >=, <, or ==.
    type: regex
    pattern: "(>=|<=|==|!=|<|>)"
  edge_value:
    label: Handles the boundary value
    hint: Check the exact boundary, like age 12 or a score of exactly 80.
    type: regex
    pattern: "(>=|<=|==)"
  loop:
    label: Uses a loop
    hint: Use a for or while loop to go through the list.
    type: regex
    pattern: "\\b(for|while)\\b"
  counter:
    label: Keeps a count
    hint: Start a counter at 0 and add 1 when the condition is true.
    type: all_of
    patterns:
    - "=\\s*0\\b"
    - "(\\+=\\s*1|=\\s*\\w+\\s*\\+\\s*1)"
  defines:
    label: Defines a function
    hint: 'Define a function with def name(parameters):'
    type: regex
    pattern: "\\bdef\\s+\\w+\\s*\\("
  returns:
    label: Returns a value
    hint: Use return to send the answer back.
    type: regex
    pattern: "\\breturn\\b"
  modulo:
    label: Uses % to test evenness
    hint: n % 2 == 0 is true when n is even.
    type: regex
    pattern: "%\\s*2"
  calls:
    label: Calls the function
    hint: Call your function with a value and use the result.
    type: regex
    pattern: "\\b\\w+\\s*\\([^)]*\\)\\s*(\\)|$|:|\\n|,)"
  order_l1:
    label: Lines in a working order
    hint: A variable has to be created before it is used. Which line creates name?
    type: parsons
    solution:
    - name = "Sam"
    - greeting = "Welcome, " + name
    - print(greeting)
  order_l2:
    label: Lines in a working order
    hint: You can only add score and bonus after both exist.
    type: parsons
    solution:
    - score = 40
    - bonus = 10
    - total = score + bonus
    - print("Total:", total)
  order_l3:
    label: Lines in a working order
    hint: The if line checks the condition; the indented line under it runs only when it's true.
    type: parsons
    solution:
    - temp = 30
    - 'if temp > 25:'
    - '    print("Hot!")'
    - 'else:'
    - '    print("Nice")'
  order_l4:
    label: Lines in a working order
    hint: Set age first, then check it with if.
    type: parsons
    solution:
    - age = 16
    - 'if age >= 18:'
    - '    print("You can vote")'
    - 'else:'
    - '    print("Not yet")'
  order_l5:
    label: Lines in a working order
    hint: Lines indented under the for repeat; a line that isn't indented runs once, after the loop.
    type: parsons
    solution:
    - 'for lap in range(1, 4):'
    - '    print("Lap", lap)'
    - print("Done!")
  order_l6:
    label: Lines in a working order
    hint: The loop needs n before it starts, and n has to get smaller inside the loop or it never ends.
    type: parsons
    solution:
    - n = 3
    - 'while n > 0:'
    - "    print(n)"
    - "    n = n - 1"
    - print("Go!")
  order_l7:
    label: Lines in a working order
    hint: Define the function (def) before you call it.
    type: parsons
    solution:
    - 'def greet(name):'
    - '    return "Hi, " + name'
    - print(greet("Ana"))
  order_l8:
    label: Lines in a working order
    hint: The function has to exist before you call it, and you print the answer after you get it.
    type: parsons
    solution:
    - 'def double(n):'
    - "    return n * 2"
    - answer = double(21)
    - print(answer)
  blank_l9_1:
    label: 'Blank 1: turns text into a number'
    hint: 'Blank 1: input() gives you text. Which function turns text into a whole number?'
    type: blank
    index: 0
    accept:
    - int
    - float
  blank_l9_2:
    label: 'Blank 2: adds the values'
    hint: 'Blank 2: Which symbol adds two numbers?'
    type: blank
    index: 1
    accept:
    - "\\+"
  blank_l9_3:
    label: 'Blank 3: prints the right variable'
    hint: 'Blank 3: Which variable holds the answer?'
    type: blank
    index: 2
    accept:
    - total
  blank_l10_1:
    label: 'Blank 1: turns a number into text'
