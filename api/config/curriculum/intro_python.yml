  to: 3
  title: Minutes to hours
  scenario: A program asks how many minutes you practiced this week.
  task: Write code that asks for minutes and prints the hours and leftover minutes.
  tip: "// and % are useful here."
- id: pp-c2-01
  concept: c2
  from: 0
  to: 1
  title: Raincoat check
  scenario: If it's raining, you need a raincoat.
  task: Write an if statement that prints "Take a raincoat" when raining is True.
  tip: 'if raining:'
- id: pp-c2-12
  concept: c2
  from: 1
  to: 2
  title: Three-way check
  scenario: A game says "Too low", "Too high", or "Got it!" for a guess.
  task: Write the if / elif / else for a guess and a secret number.
  tip: Compare guess to secret with < and >.
- id: pp-c2-23
  concept: c2
  from: 2
  to: 3
  title: Boundary hunt
  scenario: Free shipping applies to orders of $50 or more.
  task: Write the condition, then list the values you'd test to be sure it's right.
  tip: Test 49.99, 50, and 50.01.
- id: pp-c3-01
  concept: c3
  from: 0
  to: 1
  title: Repeat yourself
  scenario: You want to print "Practice!" 5 times.
  task: Write a for loop that does it.
  tip: 'for i in range(5):'
- id: pp-c3-12
  concept: c3
  from: 1
  to: 2
  title: Longest name
  scenario: names = ["Al", "Jordan", "Mia"]
  task: Write a loop that finds and prints the longest name.
  tip: Keep track of the longest so far.
- id: pp-c3-23
  concept: c3
  from: 2
  to: 3
  title: Keep asking
  scenario: A program keeps asking for a password until the user types "open".
  task: Write it with a while loop.
  tip: Loop while the answer is not "open".
- id: pp-c4-01
  concept: c4
  from: 0
  to: 1
  title: Say it twice
  scenario: You want a function that prints any message twice.
  task: Write the function and call it once.
  tip: 'def twice(message):'
- id: pp-c4-12
  concept: c4
  from: 1
  to: 2
  title: Return, don't print
  scenario: A function should give back the bigger of two numbers.
  task: Write bigger(a, b) using return, and print bigger(3, 9).
  tip: return sends the value back to the caller.
- id: pp-c4-23
  concept: c4
  from: 2
  to: 3
  title: Reuse it
  scenario: You need the average of three different lists of scores.
  task: Write one average function and use it on all three lists.
  tip: Write it once, call it three times.
