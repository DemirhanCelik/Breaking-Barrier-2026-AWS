    - print
  blank_l11_1:
    label: 'Blank 1: includes 90 itself'
    hint: 'Blank 1: 90 should be an A. Which comparison includes 90?'
    type: blank
    index: 0
    accept:
    - ">="
  blank_l11_2:
    label: 'Blank 2: checks the next case'
    hint: 'Blank 2: Which keyword checks another condition after if?'
    type: blank
    index: 1
    accept:
    - elif
  blank_l11_3:
    label: 'Blank 3: catches everything else'
    hint: 'Blank 3: Which keyword handles every case not caught above?'
    type: blank
    index: 2
    accept:
    - else
  blank_l12_1:
    label: 'Blank 1: under 12 means not 12'
    hint: 'Blank 1: "Under 12" means 12 itself pays full price. Which comparison is that?'
    type: blank
    index: 0
    accept:
    - "<"
  blank_l12_2:
    label: 'Blank 2: everyone else'
    hint: 'Blank 2: Which keyword covers everyone the if didn''t catch?'
    type: blank
    index: 1
    accept:
    - else
  blank_l13_1:
    label: 'Blank 1: loops over the list'
    hint: 'Blank 1: Which list do you want to go through?'
    type: blank
    index: 0
    accept:
    - scores
  blank_l13_2:
    label: 'Blank 2: adds each score'
    hint: 'Blank 2: Inside the loop, which variable holds the current score?'
    type: blank
