# SYNTHETIC, ILLUSTRATIVE curriculum for the "AI-Generated Design" unit.
#
# Concepts, Stage descriptors, levels, probes and CSTA mappings are placeholders
# written for the hackathon demo. Teaching & Learning must replace and approve
# them before any student sees them (BRD FR7). Kept in sync by hand with
# web/src/api/mock/curriculum.ts (the frontend's offline demo).
#
# Probe types (design §7 step 2, deterministic):
#   regex       - text matches `pattern` (case-insensitive)
#   all_of      - text matches every regex in `patterns`
#   min_words   - at least `min` words
#   list_items  - at least `min` lines starting with -, *, • or "1." ;
#                 or at least `min + 1` comma-separated chunks

unit:
  id: ai-generated-design
  name: "AI-Generated Design: Robotics Club Page"

class:
  id: k-period3
  name: "Period 3 - AI Foundations (demo)"
  bar: 2

required_concepts: [c1, c2, c3, c4]

concepts:
  - id: c1
    name: Decompose a design
    csta: 3A-AP-17 (illustrative)
    order: 1
    descriptors:
      0: Does not yet break the design into parts.
      1: Lists some parts of the design, but parts overlap or miss key pieces.
      2: Breaks the design into distinct parts and says what each part does.
      3: Orders the parts into a build plan and explains the dependencies between them.
  - id: c2
    name: Test and refine AI output
    csta: 3A-AP-21 (illustrative)
    order: 2
    descriptors:
      0: Accepts AI output without checking it.
      1: Notices a problem in AI output when it is obvious.
      2: Checks AI output against stated requirements and names a specific problem and fix.
      3: Designs tests, including edge cases, before accepting AI output.
  - id: c3
    name: AI collaboration
    csta: 3A-AP-16 (illustrative)
    order: 3
    descriptors:
      0: Sends the AI a vague request and accepts the first answer.
      1: States a goal in the prompt but leaves out constraints or edge cases.
      2: Names a goal, a constraint, and an edge case; compares AI output to intent and revises with a targeted change.
      3: Plans a multi-step exchange with the AI and explains why each revision moves the output closer to intent.
  - id: c4
    name: Responsible design
    csta: 3A-IC-24 (illustrative)
    order: 4
    descriptors:
      0: Does not consider who the design affects.
      1: Names one group of people the design could leave out.
      2: Identifies an accessibility or fairness issue and proposes a concrete change.
      3: Weighs trade-offs between design choices and justifies a decision for different users.

checks:
  length20:
    label: Response has enough detail (20+ words)
    hint: Say a bit more. Walk through your thinking in a few sentences.
    type: min_words
    min: 20
  parts3:
    label: Names at least three parts
    hint: Try listing each part of the page on its own line, starting with a dash.
    type: list_items
    min: 3
  partPurpose:
    label: Says what each part does
    hint: For each part, add what it does for a visitor, for example "events list - shows the next meetups".
    type: regex
    pattern: '\b(shows?|lets?|displays?|holds?|handles?|contains?|so (that|people|visitors)|for (visitors|members|people))\b'
  order:
    label: Orders the parts and names a dependency
    hint: Which part has to exist before another one can work? Put your parts in build order and say why.
    type: regex
    pattern: '\b(first|then|before|after|depends on|needs .* (first|before))\b'
  problem:
    label: Names a specific problem in the AI output
    hint: Point to one exact thing in the AI output that does not match what the club asked for.
    type: regex
    pattern: "\\b(bug|wrong|error|missing|broken|doesn'?t|does not|fails?|incorrect|forgot|no way to)\\b"
  requirement:
    label: Compares output to the stated requirements
    hint: Look back at what the club asked for. Which requirement does the output miss?
    type: regex
    pattern: '\b(asked|required|requirement|supposed to|should|club wants|needs? to|expected)\b'
  fix:
    label: Proposes a concrete fix
    hint: Now say what you would change to fix it.
    type: regex
    pattern: '\b(fix|change|add|remove|replace|instead|update|adjust)\b'
  testCase:
    label: Writes a test with an input and expected result
    hint: Write a test like "If I enter ___, the page should ___".
    type: regex
    pattern: '\b(if i|when i|test|try|enter|input|type)\b[\s\S]*\b(should|expect|shows?|see)\b'
  edgeCase:
    label: Covers an edge case
    hint: What happens in an unusual situation, like an empty list, a blank field, or a really long name?
    type: regex
    pattern: '\b(empty|blank|no events|nothing|too long|invalid|missing|zero|edge case|duplicate)\b'
  goal:
    label: Prompt states a goal
    hint: Start your prompt by telling the AI what you want it to make and why.
    type: regex
    pattern: '\b(make|create|build|design|write|generate|update|add|change|improve|turn|i want|i need|goal|so that)\b'
  constraint:
    label: Prompt sets a constraint
    hint: Add a limit the AI has to respect, such as "use only our two school colors" or "no more than three sections".
    type: regex
    pattern: "\\b(must|only|no more than|at most|under|limit|without|don'?t|do not|exactly|max(imum)?)\\b"
  promptEdge:
    label: Prompt names an edge case
    hint: Tell the AI what to do in an unusual case, for example "if there are no events, show a friendly message".
    type: regex
    pattern: '\b(if|when|in case|unless)\b[\s\S]*\b(empty|blank|no |none|missing|too long|invalid|zero)'
  targetedRevision:
    label: Revises with a targeted change
    hint: Ask the AI to change one specific thing and keep the rest the same.
    type: regex
    pattern: '\b(change only|just change|only change|keep (the )?rest|keep everything|instead of|replace .* with|update the)\b'
  compareIntent:
    label: Compares AI output to intent
    hint: Say what you meant, then say how the AI output differs from that.
    type: regex
    pattern: '\b(i (meant|wanted|asked)|my plan|intended|but (it|the ai)|instead it|compared to|differs?)\b'
  multiStep:
    label: Plans a multi-step exchange and explains each step
    hint: Plan two or three prompts in a row and say why each one gets closer to what you want.
    type: all_of
    patterns:
      - '\b(step|prompt) ?(1|one)\b|\bfirst\b'
      - '\b(step|prompt) ?(2|two)\b|\bthen\b|\bnext\b'
      - '\b(because|so that|this gets|closer)\b'
  group:
    label: Names a group of people who could be left out
    hint: "Think about who might have trouble using the page: people using screen readers, phones, or a different language."
    type: regex
    pattern: '\b(screen ?readers?|blind|colou?r ?blind|deaf|phones?|mobile|language|english learners?|disabilit\w*|wheelchair|older|low vision|keyboard|dyslexi\w*)\b'
  concreteChange:
    label: Proposes a concrete accessibility or fairness change
    hint: Name one change you would make to the page so that group can use it.
    type: regex
    pattern: '\b(alt text|contrast|captions?|labels?|font size|bigger|larger|translat\w*|keyboard|aria|headings?|plain language)\b'
  tradeoff:
    label: Weighs a trade-off and justifies a decision
    hint: Name something you gain and something you give up with your choice, then say why it is still the right call.
    type: regex
    pattern: '\b(trade-?off|on the other hand|however|downside|cost|versus|vs\.?|but it also)\b'

levels:
  - id: l1
    code: L1
    kind: task
    title: Sketch the parts of the club page
    intro: The Robotics Club wants a webpage. Before asking an AI to build anything, figure out what the page needs.
    instructions:
      - List the parts the page needs, one per line.
      - Next to each part, say what it does for a visitor.
    response_label: Your list of page parts
    response_placeholder: "- Header - shows the club name and logo\n- ..."
    transitions:
      - { concept: c1, from: 0, to: 1, checks: [parts3] }
  - id: l2
    code: L2
    kind: task
    title: Find what the AI got wrong on a sign-up form
    intro: The club asked for a sign-up form that collects a name and an email and confirms the sign-up. Here is what an AI made.
    instructions: [Read the AI output., Describe one thing that is wrong or missing.]
    ai_output: "<form>\n  <input placeholder=\"Your name\">\n  <button>Sign up</button>\n</form>\n<!-- On submit: nothing happens -->"
    response_label: What is wrong or missing?
    response_placeholder: The form is missing...
    transitions:
      - { concept: c2, from: 0, to: 1, checks: [problem] }
  - id: l3
    code: L3
    kind: task
    title: Write your first prompt for the page header
    intro: Time to talk to the AI. You need a header for the club page.
    instructions: [Write the prompt you would send to the AI to make the header.]
    response_label: Your prompt
    response_placeholder: Make a header for...
    transitions:
      - { concept: c3, from: 0, to: 1, checks: [goal] }
  - id: l4
    code: L4
    kind: task
    title: Spot who the page could leave out
    intro: A good page works for every student in the school, not only the people who built it.
    instructions: [Name a group of people who might have trouble using the club page, and say why.]
    response_label: Who could be left out, and why?
    response_placeholder: Students who...
    transitions:
      - { concept: c4, from: 0, to: 1, checks: [group] }
  - id: l5
    code: L5
    kind: task
    title: Break the page into buildable pieces
    intro: An AI does better with one clear piece at a time. Turn your sketch into pieces you could ask for separately.
    instructions:
      - List at least three pieces, one per line.
      - For each piece, say what it shows or lets a visitor do.
    response_label: Your buildable pieces
    response_placeholder: "- Events list - shows...\n- ..."
    transitions:
      - { concept: c1, from: 1, to: 2, checks: [parts3, partPurpose] }
  - id: l6
    code: L6
    kind: task
    title: Give the AI a goal and a limit
    intro: The club wants an events list. Vague prompts get vague results.
    instructions:
      - Write a prompt for the events list that says what you want.
      - Add at least one limit the AI must follow.
      - Tell the AI what to do in one unusual case.
    response_label: Your prompt
    response_placeholder: Create an events list that...
    transitions:
      - { concept: c3, from: 1, to: 2, checks: [goal, constraint, promptEdge] }
  - id: l7
    code: L7
    kind: task
    title: Make a test checklist for the events list
    intro: The club asked for an events list that shows the date, time, and room for each meetup, newest first. The AI says it is done.
    instructions:
      - Compare the AI output with what the club asked for.
      - Name one specific problem and how you would fix it.
    ai_output: "Events\n- Build night - Room 204\n- Competition prep - Room 110\n- Kickoff - Room 204\n(sorted oldest first)"
    response_label: Problem and fix
    response_placeholder: The club asked for... but the list...
    transitions:
      - { concept: c2, from: 1, to: 2, checks: [requirement, problem, fix] }
  - id: l8
    code: L8
    kind: task
    title: Catch the edge case before the AI does
    intro: The sign-up form now works for normal input. What about unusual input?
    instructions:
      - Write a prompt asking the AI to improve the form. Include a goal, a limit, and an edge case.
      - Add one test you would run afterward, with what you expect to see.
    response_label: Your prompt and test
    response_placeholder: Update the sign-up form so that... If I enter..., the page should...
    transitions:
      - { concept: c3, from: 1, to: 2, checks: [goal, constraint, promptEdge] }
      - { concept: c2, from: 1, to: 2, checks: [testCase, edgeCase, fix] }
  - id: l9
    code: L9
    kind: task
    title: Compare the AI's page to your plan
    intro: You planned a header, an events list, and a sign-up form. The AI built a page with a big photo gallery and no sign-up form.
    ai_output: "[Header: Robotics Club]\n[Photo gallery: 24 photos]\n[Events list]\n[Footer]"
    instructions:
      - Say how the AI page differs from your plan.
      - Break the missing part into pieces and say what each piece does.
      - Write a follow-up prompt that changes only what needs to change.
    response_label: Your comparison and follow-up prompt
    response_placeholder: "I wanted... but the AI... Pieces: - ... Follow-up: Keep the rest and..."
    transitions:
      - { concept: c3, from: 1, to: 2, checks: [compareIntent, targetedRevision] }
      - { concept: c1, from: 1, to: 2, checks: [parts3, partPurpose] }
  - id: l10
    code: L10
    kind: task
    title: Make the page work for everyone
    intro: The AI used light gray text on a white background and photos with no descriptions.
    instructions: [Name who would have trouble with this page., Propose one concrete change to fix it.]
    response_label: Who and what to change
    response_placeholder: Students who use... would... I would add...
    transitions:
      - { concept: c4, from: 1, to: 2, checks: [group, concreteChange] }
  - id: l11
    code: L11
    kind: task
    title: Fix one thing without breaking the rest
    intro: The page is almost right, but the sign-up button says "Submit query" and the club wants "Join the club".
    instructions:
      - Say what you intended and how the AI output differs.
      - Write a revision prompt that changes only that one thing.
      - Say how you would check the fix worked.
    response_label: Your revision prompt and check
    response_placeholder: "I wanted... but it... Prompt: Change only... Check: If I..."
    transitions:
      - { concept: c3, from: 1, to: 2, checks: [compareIntent, targetedRevision] }
      - { concept: c2, from: 1, to: 2, checks: [requirement, problem, fix] }
  - id: l12
    code: L12
    kind: task
    title: Plan the feature the club asked for next
    intro: The club now wants members to RSVP to each event.
    instructions:
      - Break the RSVP feature into pieces.
      - Put them in build order and say which piece depends on which.
    response_label: Your build plan
    response_placeholder: "- First, ... because...\n- Then ..."
    transitions:
      - { concept: c1, from: 2, to: 3, checks: [parts3, order, partPurpose] }
  - id: l13
    code: L13
    kind: task
    title: Stress-test the AI's RSVP logic
    intro: The AI wrote RSVP logic. Before you accept it, design tests that could break it.
    ai_output: "function rsvp(eventId, name) {\n  attendees[eventId].push(name);\n  return \"You are in!\";\n}"
    instructions:
      - Write at least two tests, each with an input and an expected result.
      - Include at least one edge case.
    response_label: Your tests
    response_placeholder: "Test 1: If I enter..., it should...\nTest 2: ..."
    transitions:
      - { concept: c2, from: 2, to: 3, checks: [testCase, edgeCase, length20] }
  - id: l14
    code: L14
    kind: task
    title: Coach the AI through a redesign
    intro: The club wants a fresh look for the whole page before the competition.
    instructions:
      - Plan two or three prompts you would send in order.
      - For each prompt, explain why it gets closer to what the club wants.
    response_label: Your prompt plan
    response_placeholder: "Prompt 1: ... because... Prompt 2: ... so that..."
    transitions:
      - { concept: c3, from: 2, to: 3, checks: [multiStep, constraint] }
  - id: l15
    code: L15
    kind: task
    title: Write a design note on a hard choice
    intro: The club wants a background video on the homepage. Some students load the page on slow phones.
    instructions:
      - Decide whether to keep the video.
      - Explain what you gain and give up, and who each choice affects.
    response_label: Your design note
    response_placeholder: I would... The trade-off is...
    transitions:
      - { concept: c4, from: 2, to: 3, checks: [tradeoff, group, length20] }
  - id: p1
    code: P1
    kind: project
    title: Build your own club page with AI
    intro: Pick any club, real or made up, and work with an AI to build its page. Use everything you practiced.
    instructions:
      - Plan the pieces of the page.
      - Write the prompts you send, and say how you checked and revised the output.
      - Note one change you made so more people can use the page.
    response_label: Your project log
    response_placeholder: "Club: ...\nPlan: ...\nPrompt 1: ...\nWhat I checked and changed: ..."
    transitions: []

project_level_id: p1

# The non-adaptive path (FR10): a fixed, working sequence through authored levels.
fallback_sequence: [l1, l2, l3, l4, l5, l6, l7, l10, l11, p1]

# Diagnostic placement (FR1, M1). Multiple-choice ladder per concept:
#   each student gets ONE question per stage (1, 2, 3) per concept, picked from
#   that stage's pool (stable per student), 12 questions in all. A concept's entry
#   stage is the highest stage answered correctly IN ORDER from Stage 1
#   (a miss stops the ladder). The answer key never leaves the API.
#
# Source: the team's "AWS Breaking Barrier" curriculum doc (Concept 1-4 question
# banks; `source` = doc concept/stage/question). The doc's concepts are mapped onto
# this unit's concepts:
#   c1 Decompose a design        <- doc Concept 2 (Computational Design Structuring)
#   c2 Test and refine AI output <- doc Concept 3, "evaluate AI output" questions
#   c3 AI collaboration          <- doc Concept 3, prompting and revision questions
#   c4 Responsible design        <- doc Concept 4 (Accessible & Inclusive) + Concept 1 (Human-Centered)
# Wording lightly edited for typos and reading level. Items with `note` were
# completed by the team and need Teaching & Learning review.
diagnostic:
  intro: >-
    Before you start, answer a few quick questions about designing websites with AI. This just helps us pick
    where you start. It is not a test, and nothing here is graded.
  bank:
    - id: c1-1a
      concept: c1
      stage: 1
      source: "C2 S1 Q1"
      prompt: "Look at this site map. Where would a page about beginner yoga classes most logically belong?"
      figure: "Home\n ├─ Activities\n ├─ About\n └─ Contact"
      options:
        - { id: a, text: "Under Contact" }
        - { id: b, text: "Outside the website structure" }
        - { id: c, text: "Under Activities" }
        - { id: d, text: "Under About" }
      answer: c
    - id: c1-1b
      concept: c1
      stage: 1
      source: "C2 S1 Q2"
      prompt: "You are planning a class schedule page. What should go in the box labeled \"main content\"?"
      options:
        - { id: a, text: "The website's file storage location" }
        - { id: b, text: "Information about the available classes and their schedules" }
        - { id: c, text: "Only the final background colors" }
        - { id: d, text: "The web hosting provider's name" }
      answer: b
    - id: c1-1c
      concept: c1
      stage: 1
      source: "C2 S1 Q3"
      note: "Options and answer drafted by the team (the source question had none). Needs T&L review."
      prompt: "A student makes a site map with the pages Home, Classes, Registration, and Contact, but the pages are not connected. What basic improvement would make the site map more useful?"
      options:
        - { id: a, text: "Connect the pages to show how a visitor moves between them, starting from Home" }
        - { id: b, text: "Give each page box a different color" }
        - { id: c, text: "Remove the Contact page so there are fewer pages" }
        - { id: d, text: "Write the page names in a bigger font" }
      answer: a
    - id: c1-2a
      concept: c1
      stage: 2
      source: "C2 S2 Q1"
      prompt: "You are planning a website for a community center. Visitors need to discover activities, schedules, and class details like instructors, and register for classes. Which site structure shows the best decomposition and organization?"
      options:
        - { id: a, text: "Homepage → Activities → Individual Class Pages → Registration, plus instructor and contact pages, with consistent navigation" }
        - { id: b, text: "One homepage with all the information, forms, schedules, and instructor profiles and no separate sections" }
        - { id: c, text: "Several disconnected pages with different information and no clear navigation" }
        - { id: d, text: "A separate website for each activity, each with its own unrelated navigation" }
      answer: a
    - id: c1-2b
      concept: c1
      stage: 2
      source: "C2 S2 Q2"
      prompt: "You are making a wireframe for a class registration page before building it. Which approach best uses abstraction?"
      options:
        - { id: a, text: "Pick the final colors, fonts, photos, and animations before deciding where content goes" }
        - { id: b, text: "Use simple boxes and labels for navigation, class information, registration fields, and buttons, and leave out visual details" }
        - { id: c, text: "Draw a detailed picture of the finished website without marking its structural parts" }
        - { id: d, text: "Copy another website's look exactly because its design was already tested" }
      answer: b
    - id: c1-2c
      concept: c1
      stage: 2
      source: "C2 S2 Q3"
      prompt: "A visitor wants to find a beginner yoga class, see its schedule, and register. Which approach shows the best structural planning?"
      options:
        - { id: a, text: "Make visitors return to the homepage after each step" }
        - { id: b, text: "Put the registration information on an unrelated page so the class page has fewer buttons" }
        - { id: c, text: "Create a clear flow from Homepage → Activities → Yoga Classes → Registration, with consistent navigation and layouts across pages" }
        - { id: d, text: "Use a different navigation menu and layout on each page to keep the site visually interesting" }
      answer: c
    - id: c1-3a
      concept: c1
      stage: 3
      source: "C2 S3 Q1"
      prompt: "Your community center site must have pages for activities, schedules, registration, and contact. While planning, you realize visitors may want to compare several activities before registering. What is the best design decision?"
      options:
        - { id: a, text: "Follow the original requirements exactly, because adding anything would complicate the site" }
        - { id: b, text: "Add a separate page for every possible action, even if navigation gets more complicated" }
        - { id: c, text: "Adjust the site map so visitors can compare activities and move directly between activity details, schedules, and registration" }
        - { id: d, text: "Use the same wireframe for every page no matter what it contains" }
      answer: c
    - id: c1-3b
      concept: c1
      stage: 3
      source: "C2 S3 Q2"
      prompt: "A team is planning a 12-page website. They need to check whether the overall navigation makes sense and whether users can easily complete a registration form. Which approach shows the strongest use of site maps and wireframes?"
      options:
        - { id: a, text: "Use a site map to check how the pages connect, and a detailed wireframe to check how the registration form is organized" }
        - { id: b, text: "Make detailed wireframes for all 12 pages before thinking about how they connect" }
        - { id: c, text: "Use only a site map, because it shows every detail of the layout" }
        - { id: d, text: "Focus on visual branding first and figure out navigation after building" }
      answer: a
    - id: c1-3c
      concept: c1
      stage: 3
      source: "C2 S3 Q3"
      prompt: "Your site lets users browse dozens of classes and register. Your first design is one long page listing every class, and testers say it is hard to find relevant activities. Which revision is best?"
      options:
        - { id: a, text: "Keep the structure and change the background colors to make it more attractive" }
        - { id: b, text: "Add more descriptions to the same page so users have more information" }
        - { id: c, text: "Create a completely different navigation system for each class category" }
        - { id: d, text: "Organize classes into consistent categories, add filtering, and reuse one class-detail layout so browsing and registering are clearer" }
      answer: d
    - id: c2-1a
      concept: c2
      stage: 1
      source: "C3 S1 Q2"
      prompt: "A student asks an AI for a blue website with three navigation buttons. The AI makes a red website with three navigation buttons. Which evaluation correctly identifies the obvious mismatch?"
      options:
        - { id: a, text: "The navigation buttons match the request, but the website uses the wrong color" }
        - { id: b, text: "The website completely matches the request" }
        - { id: c, text: "The website should be rejected because it has navigation buttons" }
        - { id: d, text: "The AI did not make any of the requested features" }
      answer: a
    - id: c2-2a
      concept: c2
      stage: 2
      source: "C3 S2 Q2"
      prompt: "You ask an AI for a website with readable text on phones, a working class search, and a visible registration button. The result has attractive colors and a visible registration button, but the text is tiny on phones and the search does not work. Which evaluation shows the best reasoning?"
      options:
        - { id: a, text: "The registration button meets one requirement, but the tiny text and broken search fail two others, so those need fixing before you accept it" }
        - { id: b, text: "It meets the request because it looks professional and has a registration button" }
        - { id: c, text: "Regenerate the whole website because the colors are not appealing" }
        - { id: d, text: "Accept it, because AI tools are generally reliable" }
      answer: a
    - id: c2-3a
      concept: c2
      stage: 3
      source: "C3 S3 Q3"
      prompt: "An AI makes a registration form that looks right and passes basic testing. But every attempt to have the AI fix its keyboard navigation breaks other features that worked. What is the best decision?"
      options:
        - { id: a, text: "Keep asking for the same change until the AI eventually gets it right" }
        - { id: b, text: "Accept the form because it looks right and works with a mouse" }
        - { id: c, text: "Keep the working parts, fix the keyboard accessibility yourself if you can, and test the final form against every requirement" }
        - { id: d, text: "Drop keyboard navigation from the requirements because the AI is struggling with it" }
      answer: c
    - id: c3-1a
      concept: c3
      stage: 1
      source: "C3 S1 Q1"
      prompt: "You want an AI to make a page showing the activities a community center offers. Which prompt states the basic goal, even if it could include more detail?"
      options:
        - { id: a, text: "Make it look interesting" }
        - { id: b, text: "Create a webpage that lists the activities offered by a community center" }
        - { id: c, text: "Generate something for visitors" }
        - { id: d, text: "Make a modern design" }
      answer: b
    - id: c3-1b
      concept: c3
      stage: 1
